# MedID Kubernetes Deployment Manifests
# Production-ready deployment with security, monitoring, and scalability

apiVersion: v1
kind: Namespace
metadata:
  name: medid
  labels:
    name: medid
    security.istio.io/tlsMode: strict
---
# ==========================================
# SECURITY POLICIES
# ==========================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medid-network-policy
  namespace: medid
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: medid
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: istio-system
  - to:
    - namespaceSelector:
        matchLabels:
          name: medid
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: medid
spec:
  mtls:
    mode: STRICT

---
# ==========================================
# SECRETS MANAGEMENT
# ==========================================

apiVersion: v1
kind: Secret
metadata:
  name: medid-database-secret
  namespace: medid
type: Opaque
data:
  # Base64 encoded values - use external secret management in production
  postgres-password: bWVkaWRfcGFzc3dvcmRfMTIz  # medid_password_123
  postgres-user: bWVkaWRfdXNlcg==  # medid_user

---
apiVersion: v1
kind: Secret
metadata:
  name: medid-app-secret
  namespace: medid
type: Opaque
data:
  jwt-secret: c3VwZXJfc2VjcmV0X2p3dF9rZXlfZm9yX21lZGlk  # super_secret_jwt_key_for_medid
  vault-token: cm9vdF90b2tlbl9mb3JfdmF1bHQ=  # root_token_for_vault

---
apiVersion: v1
kind: Secret
metadata:
  name: medid-tls-secret
  namespace: medid
type: kubernetes.io/tls
data:
  # TLS certificate and key for HTTPS
  tls.crt: LS0tLS1CRUdJTi... # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTi... # Base64 encoded private key

---
# ==========================================
# CONFIGMAPS
# ==========================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: medid-backend-config
  namespace: medid
data:
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "medid"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  VAULT_ADDR: "http://vault-service:8200"
  BIOMETRIC_SERVICE_URL: "http://biometric-service:8082"
  MAX_WORKERS: "4"
  MAX_CONNECTIONS: "200"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medid-biometric-config
  namespace: medid
data:
  SERVICE_PORT: "8082"
  LOG_LEVEL: "INFO"
  PRIMARY_ALGORITHM: "face_recognition"
  LIVENESS_REQUIRED: "true"
  QUALITY_THRESHOLD: "0.7"
  MATCH_THRESHOLD: "0.85"
  MAX_CONCURRENT_REQUESTS: "100"
  VAULT_ADDR: "http://vault-service:8200"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: medid
data:
  postgresql.conf: |
    # PostgreSQL configuration for MedID
    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.7
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 4MB
    min_wal_size = 1GB
    max_wal_size = 4GB
    
    # Security settings
    ssl = on
    ssl_cert_file = '/etc/ssl/certs/server.crt'
    ssl_key_file = '/etc/ssl/private/server.key'
    
    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_statement = 'mod'
    log_min_duration_statement = 1000

---
# ==========================================
# STORAGE
# ==========================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: medid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-pvc
  namespace: medid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi

---
# ==========================================
# DATABASE DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: medid
  labels:
    app: postgres
    component: database
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "medid"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: medid-database-secret
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: medid-database-secret
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
# ==========================================
# BACKEND DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: medid-backend
  namespace: medid
  labels:
    app: medid-backend
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medid-backend
  template:
    metadata:
      labels:
        app: medid-backend
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: medid/backend:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: medid-backend-config
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: medid-database-secret
              key: postgres-password
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: medid-database-secret
              key: postgres-user
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: medid-app-secret
              key: jwt-secret
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: medid-app-secret
              key: vault-token
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

---
# ==========================================
# BIOMETRIC SERVICE DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: medid-biometric
  namespace: medid
  labels:
    app: medid-biometric
    component: ml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medid-biometric
  template:
    metadata:
      labels:
        app: medid-biometric
        component: ml
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: biometric
        image: medid/biometric-service:latest
        ports:
        - containerPort: 8082
          name: http
        envFrom:
        - configMapRef:
            name: medid-biometric-config
        env:
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: medid-app-secret
              key: vault-token
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
# ==========================================
# REDIS DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: medid
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        args:
        - redis-server
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - "300 10"
        - --appendonly
        - "yes"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

---
# ==========================================
# VAULT DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: medid
  labels:
    app: vault
    component: security
spec:
  serviceName: vault-service
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        component: security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 1000
      containers:
      - name: vault
        image: vault:1.15
        ports:
        - containerPort: 8200
          name: vault-port
        - containerPort: 8201
          name: cluster-port
        env:
        - name: VAULT_ADDR
          value: "http://127.0.0.1:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "http://127.0.0.1:8201"
        - name: VAULT_RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: vault-storage
          mountPath: /vault/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        command:
        - vault
        - server
        - -config=/vault/config/vault.hcl
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: vault-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
# ==========================================
# SERVICES
# ==========================================

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: medid
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: medid-backend-service
  namespace: medid
  labels:
    app: medid-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: medid-backend
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: biometric-service
  namespace: medid
  labels:
    app: medid-biometric
spec:
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  selector:
    app: medid-biometric
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: medid
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: medid
  labels:
    app: vault
spec:
  ports:
  - port: 8200
    targetPort: 8200
    name: vault-port
  - port: 8201
    targetPort: 8201
    name: cluster-port
  selector:
    app: vault
  type: ClusterIP

---
# ==========================================
# INGRESS
# ==========================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medid-ingress
  namespace: medid
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
spec:
  tls:
  - hosts:
    - api.medid.example.com
    secretName: medid-tls-secret
  rules:
  - host: api.medid.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medid-backend-service
            port:
              number: 8000

---
# ==========================================
# HORIZONTAL POD AUTOSCALER
# ==========================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medid-backend-hpa
  namespace: medid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medid-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medid-biometric-hpa
  namespace: medid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medid-biometric
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

---
# ==========================================
# POD DISRUPTION BUDGETS
# ==========================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medid-backend-pdb
  namespace: medid
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: medid-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medid-biometric-pdb
  namespace: medid
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: medid-biometric

---
# ==========================================
# MONITORING
# ==========================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: medid-backend-metrics
  namespace: medid
  labels:
    app: medid-backend
spec:
  selector:
    matchLabels:
      app: medid-backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: medid-biometric-metrics
  namespace: medid
  labels:
    app: medid-biometric
spec:
  selector:
    matchLabels:
      app: medid-biometric
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s